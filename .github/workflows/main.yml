name: Build Kernel for Redmi 9T

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Free up disk space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo rm -rf /usr/local/share/boost
        sudo apt-get clean
        df -h

    - name: Checkout this repo (kernel source)
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl \
        flex g++-multilib gcc-multilib git gnupg gperf imagemagick \
        lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool \
        libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev \
        libxml2 libxml2-utils lzop pngcrush rsync schedtool \
        squashfs-tools xsltproc zip zlib1g-dev libelf-dev

    - name: Download Clang toolchain
      run: |
        mkdir -p clang
        wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/master/clang-r487747c.tar.gz -O clang.tar.gz
        tar -xzf clang.tar.gz -C clang
        rm clang.tar.gz

    - name: Clone GCC toolchains
      run: |
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 gcc-aarch64
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 gcc-arm

    - name: Build kernel
      run: |
        export ARCH=arm64
        export SUBARCH=arm64
        export CLANG_PATH="${GITHUB_WORKSPACE}/clang/bin"
        export PATH="${CLANG_PATH}:${PATH}"
        export CROSS_COMPILE="${GITHUB_WORKSPACE}/gcc-aarch64/bin/aarch64-linux-android-"
        export CROSS_COMPILE_ARM32="${GITHUB_WORKSPACE}/gcc-arm/bin/arm-linux-androideabi-"
        export KBUILD_BUILD_USER="NetHunter"
        export KBUILD_BUILD_HOST="GitHub"
        
        # Make defconfig for lime (Redmi 9T)
        make O=out lime_defconfig
        
        # Enable NetHunter features
        scripts/config --file out/.config \
          -e CONFIG_TOUCHSCREEN_FTS \
          -e CONFIG_TOUCHSCREEN_MTK_TOUCH \
          -e CONFIG_INPUT_TOUCHSCREEN \
          -e CONFIG_CFG80211 \
          -e CONFIG_MAC80211 \
          -e CONFIG_WIRELESS_EXT \
          -e CONFIG_WEXT_PRIV \
          -e CONFIG_WEXT_CORE \
          -e CONFIG_WEXT_PROC \
          -e CONFIG_USB_GADGET \
          -e CONFIG_USB_CONFIGFS \
          -e CONFIG_USB_CONFIGFS_F_HID \
          -e CONFIG_TUN \
          -e CONFIG_PACKET \
          -e CONFIG_NETFILTER
        
        make O=out olddefconfig
        
        # Build kernel
        make -j$(nproc) O=out \
          ARCH=arm64 \
          CC=clang \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=aarch64-linux-android- \
          CROSS_COMPILE_ARM32=arm-linux-androideabi-

    - name: Clone AnyKernel3
      run: |
        git clone --depth=1 https://github.com/osm0sis/AnyKernel3

    - name: Package kernel
      run: |
        cd AnyKernel3
        rm -rf .git* modules patch ramdisk
        
        cat > anykernel.sh << 'EOF'
        properties() { '
        kernel.string=NetHunter Kernel for Redmi 9T
        do.devicecheck=1
        do.modules=0
        do.systemless=1
        do.cleanup=1
        do.cleanuponabort=0
        device.name1=lime
        device.name2=lemon
        device.name3=citrus
        supported.versions=11-13
        '; }
        
        block=/dev/block/bootdevice/by-name/boot;
        is_slot_device=0;
        ramdisk_compression=auto;
        
        . tools/ak3-core.sh;
        dump_boot;
        write_boot;
        EOF
        
        cp ../out/arch/arm64/boot/Image.gz-dtb ./
        
        zip -r9 ../Kernel-NetHunter-Lime-$(date +%Y%m%d).zip * -x '*.git*' README.md

    - name: Upload kernel
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-NetHunter-Redmi9T
        path: Kernel-NetHunter-*.zip

    - name: Upload Image only
      uses: actions/upload-artifact@v4
      with:
        name: Image.gz-dtb
        path: out/arch/arm64/boot/Image.gz-dtb
